name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}
    - name: Test
      # serially, sockets share the process file descriptor table and the idle
      # benchmark measures CPU for the whole process
      run: ${{ matrix.options }} swift test -c ${{ matrix.config }} --no-parallel
  
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        container: ["swift:6.0.3", "swift:6.1.2", "swift:6.2.3"]
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.container }}-jammy
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}
    - name: Test
      run: ${{ matrix.options }} swift test -c ${{ matrix.config }} --no-parallel

  android-arm:
      name: Android
      strategy:
        fail-fast: false
        matrix:
          swift: ['6.3.3']
          arch: ['aarch64', 'x86_64', 'armv7']
      runs-on: macos-15
      timeout-minutes: 30
      steps:
        - uses: actions/checkout@v4
        - name: "Build Swift Package for Android"
          run: |
              brew install skiptools/skip/skip || (brew update && brew install skiptools/skip/skip)
              skip android sdk install --version ${{ matrix.swift }}
              ANDROID_NDK_ROOT="" skip android build --arch ${{ matrix.arch }}